<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Class Selector Example</title>
  <style>
    .highlight {
      color: white;
      background-color: orange;
      padding: 10px;
      border-radius: 5px;
    }
  </style>
</head>
<body>

  <p class="highlight">This paragraph is highlighted using a class selector.</p>
  <div class="highlight">This div also uses the same class and styling.</div>
  <p>This paragraph does not use the class and will look normal.</p>

</body>
</html>
