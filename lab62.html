<script >
	//wap to find the4 largest num among any 3 num using AND

	var a =parseInt(prompt("enter first num"));
	var b =parseInt(prompt("enter second num"));
	var c =parseInt(prompt("enter third num"));

	if (a>b && a>c){
		document.write(a+"is the largest number ")
	}
		else if(b>a&&b>c)
		{
			document.write(b+"is the largest number ")
		}
		else
		{
			document.write(c+"is the largest number")
		}
</script>
