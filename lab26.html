<!DOCTYPE html>
<html>
<head>
  <title>HTML selector</title>
  <style>
    /* This is an element selector (type selector) */
    p {
      color: green;
      font-size: 18px;
    }
  </style>
</head>
<body>

  <p>This is a paragraph.</p>
  <p>This is another paragraph.</p>
  <h1>This is a heading (not affected by the selector).</h1>

</body>
</html>
