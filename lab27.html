<!DOCTYPE html>
<html>
<head>
  <title>group selector</title>
  <style>
    /* Group selector: targets h1, p, and div elements */
    h1, p, div {
      color: darkblue;
      font-family: Arial, sans-serif;
      margin: 10px 0;
    }
  </style>
</head>
<body>

  <h1>This is a heading</h1>
  <p>This is a paragraph</p>
  <div>This is a div element</div>
  <span>This is a span (not affected)</span>

</body>
</html>
