<!DOCTYPE html>
<html>
<head>
	<title>Mouse hover </title>
	<style >
		p{
			background: pink ;
			height: 300 px ;
			color: #FFF ;
		}
		p:hover{
            background: green ;
            height: 300 px;
            color:#FFF;
		}
	</style>
</head>
<body>
  <p>My name is Jamuna tamang .</p>
</body>
</html>
